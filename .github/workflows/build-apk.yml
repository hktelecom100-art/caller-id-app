name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project files
        run: |
          found=""
          if [ -f caller_id_app/tools/patch_android.py ]; then found=1; fi
          if [ -z "$found" ] && [ -f tools/patch_android.py ]; then
            mkdir -p caller_id_app
            cp -r lib tools pubspec.yaml caller_id_app/
            found=1
          fi
          if [ -z "$found" ]; then
            for z in *.zip; do
              [ -e "$z" ] || continue
              rm -rf /tmp/z && mkdir /tmp/z
              unzip -q -o "$z" -d /tmp/z || continue
              if [ -f /tmp/z/caller_id_app/tools/patch_android.py ]; then
                rm -rf caller_id_app
                cp -r /tmp/z/caller_id_app ./caller_id_app
                found=1
              fi
            done
          fi
          if [ -z "$found" ]; then
            echo "NEW FILES NOT FOUND. Files in repo:"
            ls -la
            exit 1
          fi
          rm -rf lib
          cp -r caller_id_app/lib ./lib
          cp caller_id_app/pubspec.yaml ./pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android scaffold
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=android --project-name caller_id_app --org com.example .
          rm -rf lib && cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -rf test

      - name: Patch Android project
        run: python3 caller_id_app/tools/patch_android.py

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: caller-id-apk
          path: build/app/outputs/flutter-apk/app-release.apk
